# electron-builder: packages the built app (`out/`, from `npm run build`) into installers.
# Local use: `npm run dist:dir` (unpacked app) or `npm run dist` (installers, never published).
# Releases: .github/workflows/release.yml, run by pushing a version tag (v1.2.3). See the README.
# Reference: https://www.electron.build/configuration

# Never change the appId after the first release: Windows ties the installation and its
# updates to it, and macOS ties the app's keychain entries to it.
appId: com.incarnamind.app
productName: IncarnaMind

directories:
  output: dist
  buildResources: build

# Only the bundled app goes in. The production dependencies in node_modules are added
# automatically; the rest of the repo (sources, tests, the sample PDFs in data/) stays out.
# electron-builder arranges them itself, and a direct dependency's version wins the top
# level: so zod is one (4.6.5, as the AI SDK uses it), and sandbox-runtime's zod 3 nests.
#
# A platform's own `files` list REPLACES this one rather than adding to it: with only
# exclusions there, electron-builder falls back to "**/*" and packs the whole checkout
# (sources, tests, data, untracked files) into app.asar. So every platform below restates
# out/**/* and the exclusions below, and scripts/check-package.mjs fails the release build if
# anything else gets in.
files:
  - out/**/*
  # Dependencies' source maps, TypeScript sources and declarations, MDX docs and test coverage:
  # nothing the app reads at run time, and about 73 MB of app.asar (scripts/check-package.mjs).
  - "!**/node_modules/**/*.map"
  - "!**/node_modules/**/*.{ts,mts,cts,tsx}"
  - "!**/node_modules/**/*.mdx"
  - "!**/node_modules/**/coverage/**"

# The built-in Skills (SKILL.md folders), next to app.asar in the app's resources folder,
# where the main process finds them (src/main/platform.ts). The core installs them into
# the data folder at startup. tests/core/builtInSkills.test.ts checks this entry.
extraResources:
  - from: resources/skills
    to: skills
    filter:
      - "**/*"
  # The example Mind's Documents (src/core/examples.ts), with their licence.
  - from: resources/examples
    to: examples
    filter:
      - "**/*"
  # The citation-style engine (wasm/citation-styles, built and committed) and every CSL style and
  # locale, unmodified, in one pack with their licence notice (ADR-0016).
  - from: resources/citation-styles
    to: citation-styles
    filter:
      - "**/*"
  # What Analyses run with (ADR-0023): Pyodide's files, unmodified, and the wheels of numpy, pandas
  # and what they depend on, which the build fetches into resources/python
  # (scripts/pythonRuntime.ts), each checked against Pyodide's lock file. Their licences are in
  # notices/python.txt.
  - from: resources/python
    to: python
    filter:
      - "**/*"
  # The licence notices: what the model catalog is generated from (scripts/catalogModels.ts),
  # the citation-style engine's crates and where the CSL styles come from, the Speex code the
  # Meetings echo canceller is derived from, and what Analyses run with.
  - from: resources/notices
    to: notices
    filter:
      - "**/*"

# onnxruntime-node, which runs the built-in embedding model in a utility process, loads
# native libraries with dlopen, which can't read inside app.asar. Each platform below
# keeps only its own libraries: the package ships them for every platform (about 250 MB).
asarUnpack:
  - "**/node_modules/onnxruntime-node/bin/**"
  - "**/node_modules/@napi-rs/canvas*/**"
  # sherpa-onnx-node, which transcribes Meetings in a utility process (#136): its addon and the
  # ONNX Runtime it bundles, one prebuilt package per platform and architecture, loaded beside
  # each other (@loader_path, $ORIGIN).
  - "**/node_modules/sherpa-onnx-*/**"
  # The OS sandbox's seccomp helper, which bubblewrap runs on Linux: it can't run one inside
  # app.asar (src/main/platform.ts points sandbox-runtime at this copy).
  - "**/node_modules/@anthropic-ai/sandbox-runtime/vendor/seccomp/**"

# No spaces in file names, and the architecture in every name: the auto-updater tells the
# Apple silicon and Intel macOS downloads apart by it.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  # The app icon, written by `npm run icons`. macOS 26 shows the Icon Composer icon compiled
  # into Assets.car (below), in Default and Dark, cut to the system's shape; icon.icns, which
  # has the 16 and 32 px drawings, is the fallback and the dmg's volume icon. electron-builder
  # could compile build/icon/AppIcon.icon itself, but would then scale its .icns from the
  # master, and every Mac that packages would need Xcode 26.
  icon: build/icon/icon.icns
  # Meetings (ADR-0015): what macOS says when IncarnaMind first asks to record, in English here
  # and in Chinese from zh_CN.lproj (tests/main/meetingPermissions.test.ts checks both).
  extendInfo:
    NSMicrophoneUsageDescription: "When you record a meeting, IncarnaMind records your microphone. The audio stays on this Mac."
    NSAudioCaptureUsageDescription: "When you record a meeting, IncarnaMind records the computer's sound: the other people in the meeting. The audio stays on this Mac."
    CFBundleIconName: AppIcon
  extraResources:
    - from: build/zh_CN.lproj
      to: zh_CN.lproj
    - from: build/icon/Assets.car
      to: Assets.car
  # electron-builder's default entitlements, and the microphone, which a hardened-runtime build
  # can't open without it.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  files:
    - out/**/*
    - "!**/node_modules/**/*.map"
    - "!**/node_modules/**/*.{ts,mts,cts,tsx}"
    - "!**/node_modules/**/*.mdx"
    - "!**/node_modules/**/coverage/**"
    # The arm64 and x64 apps are built separately: each keeps its own architecture.
    - "!**/node_modules/onnxruntime-node/bin/napi-v*/{linux,win32}{,/**}"
    - "!**/node_modules/onnxruntime-node/bin/napi-v*/darwin/!(${arch}){,/**}"
    # The release workflow puts the other macOS architecture's speech package beside this one.
    - "!**/node_modules/sherpa-onnx-darwin-!(${arch}){,/**}"
  # The zip is what auto-update downloads; the dmg is what people install from.
  target:
    - dmg
    - zip
  # Signing uses the Developer ID certificate in CSC_LINK when it's set. Notarization
  # runs after signing when Apple credentials are in the environment (APPLE_ID, or
  # APPLE_API_KEY). The release workflow ad-hoc signs instead when there's no certificate.

dmg:
  # The zip carries the update metadata; the dmg doesn't need a blockmap.
  writeUpdateInfo: false

win:
  icon: build/icon/icon.ico
  files:
    - out/**/*
    - "!**/node_modules/**/*.map"
    - "!**/node_modules/**/*.{ts,mts,cts,tsx}"
    - "!**/node_modules/**/*.mdx"
    - "!**/node_modules/**/coverage/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v*/{darwin,linux}{,/**}"
    - "!**/node_modules/onnxruntime-node/bin/napi-v*/win32/!(${arch}){,/**}"
  # SignPath signs the app and the installer in the release workflow, not electron-builder
  # (docs/releasing.md, Windows signing). With no certificate here, app-update.yml gets no
  # publisherName, so updates aren't checked for their signer: right for SignPath's test
  # certificate, which Windows doesn't trust. With the SignPath Foundation certificate, set
  # signtoolOptions.publisherName to its subject.
  target:
    - nsis

nsis:
  # A per-user, one-click install: no admin rights or questions, for installs and updates alike.
  oneClick: true
  perMachine: false

linux:
  category: Office
  # electron-builder reads each PNG's size from its name (16x16.png).
  icon: build/icon/png
  files:
    - out/**/*
    - "!**/node_modules/**/*.map"
    - "!**/node_modules/**/*.{ts,mts,cts,tsx}"
    - "!**/node_modules/**/*.mdx"
    - "!**/node_modules/**/coverage/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v*/{darwin,win32}{,/**}"
    - "!**/node_modules/onnxruntime-node/bin/napi-v*/linux/!(${arch}){,/**}"
  # The .deb needs a maintainer with an address; this one reaches no one's inbox.
  maintainer: IncarnaMind <noreply@users.noreply.github.com>
  # On Ubuntu 24.04 and later an AppImage runs without Chromium's sandbox: its AppRun script
  # adds --no-sandbox when AppArmor refuses user namespaces. The .deb installs an AppArmor
  # profile that allows them (#1178).
  target:
    - AppImage
    - deb

publish:
  provider: github
  owner: IncarnaMind
  repo: IncarnaMind
  # Releases start as drafts. Installed apps only see an update once a maintainer publishes it.
  releaseType: draft
