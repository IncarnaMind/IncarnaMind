<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图书馆志愿值班手册</title>
</head>
<body>
<h1>图书馆志愿值班手册</h1>
<p>本手册供工作日上午值班的志愿者使用，纸质版放在一楼服务台。</p>
<h2>开馆准备</h2>
<p>上午九点整打开少儿阅览区的灯，比大门开启时间早半小时。</p>
<p>最后再开古籍柜的展示灯，等保洁人员离开之后。</p>
<h2>楼层检查表</h2>
<p>闭馆前由值班志愿者走一遍各楼层，并在服务台签字。</p>
<table>
<thead>
<tr><th>楼层</th><th>检查项目</th><th>时间</th></tr>
</thead>
<tbody>
<tr><td>二层阅览室</td><td>窗户关闭</td><td>17:45</td></tr>
<tr><td>古籍室</td><td>展示灯关闭</td><td>18:00</td></tr>
</tbody>
</table>
<h2>随身要带的东西</h2>
<p>请佩戴绿色挂绳，并把对讲机调到二频道。</p>
<ul>
<li>带上蓝色夹板和读者统计表。</li>
<li>携带少儿阅览区的备用钥匙。</li>
<li>在前台抽屉里放一支手电筒。</li>
</ul>
</body>
</html>
