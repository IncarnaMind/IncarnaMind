<title>社区花园浇水指南</title>
</head>
<body>
<h1>社区花园浇水指南</h1>
<p>本指南适用于北苑社区花园的十二块菜地，由社区志愿小组每季度更新一次。</p>
<h2>浇水安排</h2>
<p>东侧菜地每周二和周五傍晚浇水，每次浇水不超过一小时。</p>
<p>西侧菜地只在周日上午浇水，遇到连续高温天气可以增加一次。</p>
<h2>水箱与水泵记录</h2>
<p>每台水泵每年检修一次，检修记录由值班志愿者填写。</p>
<table>
<thead>
<tr><th>水箱</th><th>容量</th><th>上次检修</th></tr>
</thead>
<tbody>
<tr><td>北侧水箱</td><td>1200升</td><td>2027年3月12日</td></tr>
<tr><td>泵房水箱</td><td>800升</td><td>2027年2月4日</td></tr>
</tbody>
</table>
<h2>入冬前的准备</h2>
<p>第一次霜冻前，请按下面的清单完成准备。</p>
<ul>
<li>把水管收进工具房并排空积水。</li>
<li>给泵房外的水龙头包上保温层。</li>
<li>把备用的浇水壶搬回室内。</li>
</ul>
</body>
</html>
