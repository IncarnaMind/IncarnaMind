name: Install apt packages from a cache
description: >
  Installs apt packages. On some runners the package mirror serves package files at about
  50 kB/s (#1731), so the packages' .deb files are restored from a cache and apt downloads only
  what the cache lacks. Only a run on main saves a cache that every other ref reads, so the
  action saves one only there: the nightly run keeps it current.

inputs:
  packages:
    description: The apt packages to install, separated by spaces.
    required: true

runs:
  using: composite
  steps:
    # The runner image sets the package versions apt resolves, so a new image gets a new key until
    # a night on main has saved it. The prefix restores the last image's files meanwhile, and apt
    # downloads only the ones that differ.
    - id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        name="${PACKAGES// /-}"
        echo "dir=$HOME/.cache/ci-apt/$name" >> "$GITHUB_OUTPUT"
        echo "key=apt-$name-${ImageOS:-linux}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "prefix=apt-$name-${ImageOS:-linux}-" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: Install ${{ inputs.packages }}
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        DIR: ${{ steps.key.outputs.dir }}
      run: |
        mkdir -p "$DIR/partial"
        printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
        options=(-y --no-install-recommends -o "Dir::Cache::archives=$DIR" -o APT::Sandbox::User=root -o APT::Keep-Downloaded-Packages=true)
        # A download is dropped after 5 minutes and tried from the other mirror, which also stops
        # a slow one from holding the runner; the last try has no limit, so an install that
        # would pass slowly still passes. It is downloaded before it is installed so that the
        # limit never stops dpkg half way.
        for attempt in 1 2 3; do
          case $attempt in
            1) host=archive.ubuntu.com limit=300 ;;
            2) host=azure.archive.ubuntu.com limit=300 ;;
            3) host=archive.ubuntu.com limit=0 ;;
          esac
          sudo sed -i -E "s#//(azure\.)?archive\.ubuntu\.com/#//$host/#g" /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo timeout 120 apt-get update -qq || echo "::warning::apt-get update failed, so apt uses the package lists the runner has"
          if sudo timeout "$limit" apt-get install --download-only "${options[@]}" $PACKAGES; then
            sudo apt-get install "${options[@]}" $PACKAGES
            exit 0
          fi
          echo "::warning::Downloading $PACKAGES from $host did not finish (try $attempt of 3)"
        done
        exit 1
    # autoclean drops the files of versions the mirror no longer has, which a restore by prefix
    # brought in. apt leaves root's lock file and the _apt user's download folder in the
    # directory; the cache's archiver runs as the runner user and fails on both.
    - name: Keep the downloaded files for other runs
      if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        DIR: ${{ steps.key.outputs.dir }}
      run: |
        sudo apt-get -o "Dir::Cache::archives=$DIR" autoclean
        sudo rm -rf "$DIR/partial" "$DIR/lock"
        sudo chown -R "$(id -u):$(id -g)" "$DIR"
    - if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
