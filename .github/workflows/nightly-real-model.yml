name: Nightly real models

# The checks that ask real models: the live tests (tests/live, sharded into four parallel jobs so
# the full suite finishes every night) and the everyday requests (eval/everyday) on Claude Haiku
# 5.5, Kimi International for Chinese, and DeepSeek V4.1 Flash for Chinese (skipped when
# NIGHTLY_DEEPSEEK_KEY is absent). Every night on main, and by hand (workflow_dispatch). It costs
# money, so it is a file of its own: nightly.yml's jobs can be run by hand without it.
# scripts/nightlyRealModel.ts says how it picks a key, what it writes and what it needs;
# docs/agents/checks.md says how to run it and which secrets to set.

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Only these steps, separated by commas: live, everyday, kimi-live, kimi-everyday, deepseek-live, deepseek-everyday, claim-probes. Empty: all of them."
        required: false
        default: ""
      requests:
        description: "Only these everyday requests, as INCARNAMIND_EVAL_EVERYDAY takes them (hard, research, dates, chinese, or ids). Empty: all of them."
        required: false
        default: ""

permissions:
  contents: read

env:
  # The evaluation drives the core in plain Node, on the CPU.
  ONNXRUNTIME_NODE_INSTALL: skip
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

concurrency:
  group: nightly-real-model
  cancel-in-progress: false

jobs:
  # Four explicit jobs (not a matrix) so each shard hands its own `status` output to red-night.
  live-1:
    name: Live tests on Claude (1/4)
    outputs:
      status: ${{ steps.run.outputs.status }}
    # A run by hand from another branch would give that branch's files the keys.
    if: github.repository == 'IncarnaMind/IncarnaMind' && github.ref == 'refs/heads/main' && (inputs.steps == '' || contains(format(',{0},', replace(inputs.steps, ' ', '')), ',live,'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - id: run
        uses: ./.github/actions/nightly-real-model
        with:
          steps: live
          live-shard: 1/4
          artifact-name: nightly-real-model-live-1
          anthropic-key-1: ${{ secrets.NIGHTLY_ANTHROPIC_KEY_1 }}
          anthropic-key-2: ${{ secrets.NIGHTLY_ANTHROPIC_KEY_2 }}

  live-2:
    name: Live tests on Claude (2/4)
    outputs:
      status: ${{ steps.run.outputs.status }}
    if: github.repository == 'IncarnaMind/IncarnaMind' && github.ref == 'refs/heads/main' && (inputs.steps == '' || contains(format(',{0},', replace(inputs.steps, ' ', '')), ',live,'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - id: run
        uses: ./.github/actions/nightly-real-model
        with:
          steps: live
          live-shard: 2/4
          artifact-name: nightly-real-model-live-2
          anthropic-key-1: ${{ secrets.NIGHTLY_ANTHROPIC_KEY_1 }}
          anthropic-key-2: ${{ secrets.NIGHTLY_ANTHROPIC_KEY_2 }}

  live-3:
    name: Live tests on Claude (3/4)
    outputs:
      status: ${{ steps.run.outputs.status }}
    if: github.repository == 'IncarnaMind/IncarnaMind' && github.ref == 'refs/heads/main' && (inputs.steps == '' || contains(format(',{0},', replace(inputs.steps, ' ', '')), ',live,'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - id: run
        uses: ./.github/actions/nightly-real-model
        with:
          steps: live
          live-shard: 3/4
          artifact-name: nightly-real-model-live-3
          anthropic-key-1: ${{ secrets.NIGHTLY_ANTHROPIC_KEY_1 }}
          anthropic-key-2: ${{ secrets.NIGHTLY_ANTHROPIC_KEY_2 }}

  live-4:
    name: Live tests on Claude (4/4)
    outputs:
      status: ${{ steps.run.outputs.status }}
    if: github.repository == 'IncarnaMind/IncarnaMind' && github.ref == 'refs/heads/main' && (inputs.steps == '' || contains(format(',{0},', replace(inputs.steps, ' ', '')), ',live,'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - id: run
        uses: ./.github/actions/nightly-real-model
        with:
          steps: live
          live-shard: 4/4
          artifact-name: nightly-real-model-live-4
          anthropic-key-1: ${{ secrets.NIGHTLY_ANTHROPIC_KEY_1 }}
          anthropic-key-2: ${{ secrets.NIGHTLY_ANTHROPIC_KEY_2 }}

  real-models:
    name: Real-model checks
    outputs:
      status: ${{ steps.run.outputs.status }}
    if: github.repository == 'IncarnaMind/IncarnaMind' && github.ref == 'refs/heads/main' && replace(inputs.steps, ' ', '') != 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@v7
      - id: run
        uses: ./.github/actions/nightly-real-model
        with:
          steps: ${{ inputs.steps }}
          skip-steps: live
          requests: ${{ inputs.requests }}
          artifact-name: nightly-real-model
          save-cache: "true"
          anthropic-key-1: ${{ secrets.NIGHTLY_ANTHROPIC_KEY_1 }}
          anthropic-key-2: ${{ secrets.NIGHTLY_ANTHROPIC_KEY_2 }}
          kimi-key: ${{ secrets.NIGHTLY_KIMI_KEY }}
          deepseek-key: ${{ secrets.NIGHTLY_DEEPSEEK_KEY }}

  # Keeps one issue, "Nightly is red", true to this night (scripts/nightlyIssue.ts), and closes it
  # when every nightly is green again. Only a night the schedule started on main reports.
  red-night:
    name: A red night shows itself
    needs: [live-1, live-2, live-3, live-4, real-models]
    if: ${{ always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'IncarnaMind/IncarnaMind' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The two nightlies write the same issue, one after the other.
    concurrency:
      group: nightly-red-issue
      cancel-in-progress: false
    # The one job that may write an issue; it reads the run's jobs and logs to name what failed.
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/nightlyIssue.ts real-models
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
