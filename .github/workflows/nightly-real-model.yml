name: Nightly real models

# The checks that ask real models: the live tests (tests/live) and the everyday requests
# (eval/everyday) on Claude Haiku 5.5, and Kimi International for Chinese. Every night on main, and
# by hand (workflow_dispatch). It costs money, so it is a file of its own: nightly.yml's jobs can
# be run by hand without it. scripts/nightlyRealModel.ts says how it picks a key, what it writes
# and what it needs; docs/agents/testing.md says how to run it and which secrets to set.

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Only these steps, separated by commas: live, everyday, kimi-live, kimi-everyday. Empty: all of them."
        required: false
        default: ""
      requests:
        description: "Only these everyday requests, as INCARNAMIND_EVAL_EVERYDAY takes them (hard, research, dates, chinese, or ids). Empty: all of them."
        required: false
        default: ""

permissions:
  contents: read

env:
  # The evaluation drives the core in plain Node, on the CPU.
  ONNXRUNTIME_NODE_INSTALL: skip
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

concurrency:
  group: nightly-real-model
  cancel-in-progress: false

jobs:
  real-models:
    name: Real-model checks
    outputs:
      status: ${{ steps.checks.outputs.status }}
    # A run by hand from another branch would give that branch's files the keys.
    if: github.repository == 'IncarnaMind/IncarnaMind' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Analysis live tests run the Python the app's build puts in resources/python
      # (tests/helpers/pyodideAnalysis.ts).
      - name: Build the app's Python
        run: npm run build
      - name: Restore the models and the fetched Documents
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/incarnamind-eval
          key: incarnamind-everyday-${{ hashFiles('src/core/embedding/model.ts', 'src/core/reranking/model.ts') }}
      - name: Run the checks
        id: checks
        run: npm run nightly:real-model
        env:
          NIGHTLY_ANTHROPIC_KEY_1: ${{ secrets.NIGHTLY_ANTHROPIC_KEY_1 }}
          NIGHTLY_ANTHROPIC_KEY_2: ${{ secrets.NIGHTLY_ANTHROPIC_KEY_2 }}
          NIGHTLY_KIMI_KEY: ${{ secrets.NIGHTLY_KIMI_KEY }}
          NIGHTLY_STEPS: ${{ inputs.steps }}
          INCARNAMIND_EVAL_EVERYDAY: ${{ inputs.requests }}
      - name: Keep the models and the fetched Documents
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/incarnamind-eval
          key: incarnamind-everyday-${{ hashFiles('src/core/embedding/model.ts', 'src/core/reranking/model.ts') }}
      # Not the steps' own reports (vitest.json, everyday/): they hold what the providers answered,
      # with account and key ids in it, and anyone can download an artifact of a public run.
      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-real-model
          path: |
            eval/results/nightly-real-model/summary.md
            eval/results/nightly-real-model/status.json
            eval/results/nightly-real-model/**/usage.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # Keeps one issue, "Nightly is red", true to this night (scripts/nightlyIssue.ts), and closes it
  # when every nightly is green again. Only a night the schedule started on main reports.
  red-night:
    name: A red night shows itself
    needs: [real-models]
    if: ${{ always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'IncarnaMind/IncarnaMind' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The two nightlies write the same issue, one after the other.
    concurrency:
      group: nightly-red-issue
      cancel-in-progress: false
    # The one job that may write an issue; it reads the run's jobs and logs to name what failed.
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/nightlyIssue.ts real-models
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
