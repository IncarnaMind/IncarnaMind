name: Nightly

# Checks that would slow every pull request, or need runners there are few of, run here: every
# night on main, and by hand (workflow_dispatch). A failing night is fixed before new work, like
# a red main. The rest of the scheduled runs planned in #331 (speed, soak, quitting halfway,
# messy files, journeys, and a weekly Windows smoke test) join this file as more jobs.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # onnxruntime-node's install script downloads its CUDA libraries on Linux x64. The app runs
  # the embedding model on the CPU, so skip them.
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: nightly-${{ github.ref }}
  # A night's run on main always finishes.
  cancel-in-progress: false

jobs:
  # The whole smoke suite on macOS, including the specs only macOS has, such as the traffic
  # lights in the title bar (e2e/titleBar.spec.ts) and full screen. As one job it takes about three
  # hours there, so it is split into shards that run at once, balanced as CI's Linux shards are
  # (scripts/smoke-shard.mjs and e2e/durations.json). macOS takes about 1.4 times as long as Linux
  # for the same specs, so five shards come to about 42 minutes each. Only five macOS jobs run at
  # once and the packaged job below is a sixth, so it and a shard take turns: the night is about 46
  # minutes. Four shards would be about 52 each, too near the 60-minute limit; six leave two jobs
  # waiting, about 70 minutes in all.
  smoke-macos:
    name: Smoke shard ${{ matrix.shard }}/5 (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Downloads from GitHub's releases fail now and then (a 500), and each shard downloads
      # Electron, so a failed download is tried again here rather than failing every spec.
      - name: Make sure Electron is installed
        run: |
          for attempt in 1 2 3; do
            node node_modules/electron/install.js && exit 0
            sleep 20
          done
          exit 1
      # A failed spec is tried once more here, and one that passes then is listed below, so the
      # night stays green on a slow runner's one-off and the flake is counted, not hidden. Pull
      # requests don't retry (playwright.config.ts).
      - run: npm run test:smoke -- --retries=1 --reporter=github,list,json $(node scripts/smoke-shard.mjs ${{ matrix.shard }} 5)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: flaky-report.json
      - name: List the specs that passed only on a retry
        id: flaky
        if: always()
        run: |
          test -f flaky-report.json || exit 0
          flaky="$(jq -r '.. | objects | select(has("specs")) | .specs[] | select(any(.tests[]; .status == "flaky")) | "e2e/\(.file):\(.line) \(.title)"' flaky-report.json)"
          {
            echo "### Smoke shard ${{ matrix.shard }}/5 (macOS): specs that passed only on a retry"
            if [ -z "$flaky" ]; then echo "None."; else echo "$flaky" | sed 's/^/- /'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -n "$flaky" ] || exit 0
          echo "flaky=true" >> "$GITHUB_OUTPUT"
          echo "$flaky" | while IFS= read -r spec; do
            echo "::warning title=Passed only on a retry::$spec"
          done
      - name: Upload Playwright traces
        if: failure() || steps.flaky.outputs.flaky == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results-macos-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The packaged app transcribes a meeting with its real speech engine and model (#1239), as
  # ci.yml runs it for a pull request that changes what it covers.
  packaged-transcription:
    name: Packaged app transcribes a meeting (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Package the app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:dir -- -c.mac.identity=- -c.mac.notarize=false
      - uses: ./.github/actions/packaged-transcription

  # The Word corpus (eval/word/README.md): the committed files and the extended set, fetched from
  # their commit-pinned URLs, opened in LibreOffice headless.
  word-corpus:
    name: Word corpus, core and extended
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      INCARNAMIND_WORD_REQUIRE_LIBREOFFICE: "1"
      INCARNAMIND_WORD_SET: all
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install LibreOffice Writer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: npm run eval:word:fetch
      - run: npm run eval:word
