name: Evaluation

# The retrieval and Citation evaluation (eval/README.md). Manual only, never on
# push: it downloads the embedding model, and with a chat model it asks real
# Questions, which costs money. The retrieval part needs no secrets.

on:
  workflow_dispatch:
    inputs:
      chat_kind:
        description: "Chat provider for the Citation part: anthropic, openai or google. Leave empty for retrieval only."
        required: false
        default: ""
      chat_model:
        description: "Chat model id, e.g. the current Claude Sonnet. Its key is the INCARNAMIND_EVAL_CHAT_KEY secret."
        required: false
        default: ""

permissions:
  contents: read

env:
  # As in CI: the model runs on the CPU, so onnxruntime-node's CUDA libraries aren't needed,
  # and the evaluation drives the core in plain Node, without the Electron binary.
  ONNXRUNTIME_NODE_INSTALL: skip
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  eval:
    name: Retrieval and Citation evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache the built-in embedding model
        uses: actions/cache@v5
        with:
          path: ~/.cache/incarnamind-eval
          # The model's pinned revision (src/core/embedding/model.ts).
          key: incarnamind-eval-multilingual-e5-small-761b726dd34f
      - name: Run the evaluation
        run: npm run eval
        env:
          INCARNAMIND_EVAL_CHAT_KIND: ${{ inputs.chat_kind }}
          INCARNAMIND_EVAL_CHAT_MODEL: ${{ inputs.chat_model }}
          INCARNAMIND_EVAL_CHAT_KEY: ${{ inputs.chat_kind != '' && secrets.INCARNAMIND_EVAL_CHAT_KEY || '' }}
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: eval/results/
          if-no-files-found: ignore
          retention-days: 30
