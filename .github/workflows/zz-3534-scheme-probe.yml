name: Probe 3534 scheme (throwaway)

# Removed before the merge: each system's package registers the app's own scheme as ADR-0033 says.
on:
  push:
    branches: [feat/3534-app-link]

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: macOS app's Info.plist
        if: runner.os == 'macOS'
        run: |
          npx electron-builder --mac --dir --publish never
          PLIST=$(ls -d dist/mac*/IncarnaMind.app)/Contents/Info.plist
          plutil -extract CFBundleURLTypes json -o - "$PLIST"
      - name: Windows installer, with the uninstaller's step
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npx electron-builder --win nsis --x64 --publish never 2>&1 | tee build.log
          ls -la dist/*.exe
          grep -i "installer.nsh\|include" build.log | head -5 || true
      - name: Linux .deb's .desktop file
        if: runner.os == 'Linux'
        run: |
          npx electron-builder --linux deb --x64 --publish never
          mkdir deb && dpkg-deb -x dist/*.deb deb
          grep -r "MimeType" deb/usr/share/applications/
