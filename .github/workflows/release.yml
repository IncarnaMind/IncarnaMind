name: Release

# Pushing a version tag (v1.2.3, v1.2.3-beta.1) builds the installers on macOS, Windows and
# Linux and uploads them, with the auto-update metadata, to a draft GitHub Release.
# A maintainer then reviews the draft and publishes it. See "Cutting a release" in docs/releasing.md.
on:
  push:
    # Version tags only: v1-python-cli, the tag of the old Python tool, doesn't match.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  # SignPath reads the Windows job and downloads its artifacts with this workflow's token.
  actions: read
  contents: write

env:
  # onnxruntime-node's install script downloads its CUDA libraries (hundreds of MB) on Linux
  # x64, and the AppImage would ship them. The app runs the embedding model on the CPU.
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Create the draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the package.json version ($version). Tag the commit that sets the version as v$version."
            exit 1
          fi
      # Created once, up front, so the three builds below upload to the same release
      # instead of racing to create one each.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME exists already; the builds upload to it."
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
              --title "IncarnaMind ${GITHUB_REF_NAME#v}"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Where opt-in crash reports go. Without the secret it's empty, and the build
          # doesn't offer crash reports at all (src/main/crashReports.ts).
          MAIN_VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # The PostHog project usage data goes to, only with the User's consent. Without
          # both variables the build sends no usage data and doesn't ask (src/main/usageData.ts).
          MAIN_VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          MAIN_VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          # Only a tester tag (v0.9.0-tester.1) makes a test build, for invited testers: usage
          # data is on until the User turns it off, and the first run says so. Every other tag,
          # -alpha and -beta included, asks first.
          MAIN_VITE_TESTER_BUILD: ${{ contains(github.ref_name, '-tester') && '1' || '' }}

      # The three packaging steps build into dist/ and upload nothing: the upload is the last
      # step, once the package check has passed.
      # Signs with the Developer ID certificate and notarizes when the secrets exist.
      # Without the certificate, the app is ad-hoc signed instead: it still opens (see the
      # README), but it can't update itself, and the job still succeeds.
      - name: Package and publish (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A base64-encoded .p12 export of a "Developer ID Application" certificate, and its password.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization with an Apple ID and an app-specific password...
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # ...or with an App Store Connect API key (the contents of the .p8 file).
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          signing=""
          if [ -z "$CSC_LINK" ]; then
            echo "::warning title=Unsigned macOS build::No CSC_LINK secret, so the macOS app is ad-hoc signed and not notarized. It can't update itself."
            # A missing secret still arrives as an empty variable, and electron-builder reads an
            # empty CSC_LINK as a path: the checkout folder, "not a file".
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID \
              APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            signing="-c.mac.identity=- -c.mac.notarize=false"
          else
            if [ -n "$APPLE_API_KEY_P8" ]; then
              # electron-builder wants the API key as a file.
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
              printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
            elif [ -z "$APPLE_ID" ]; then
              echo "::warning title=macOS build not notarized::The app is signed, but there are no notarization secrets, so Gatekeeper will still block it."
            fi
          fi
          # Apple silicon only: Macs with an Intel processor aren't supported (#2199).
          # $signing is unquoted on purpose: it holds zero or two arguments.
          npx electron-builder --mac --arm64 --publish never $signing

      # With the SIGNPATH_API_TOKEN secret, SignPath signs IncarnaMind.exe, then the installer
      # built from it (docs/releasing.md, Windows signing). Without it, the installer is unsigned
      # (SmartScreen warns, see the README) and the job still succeeds. Linux needs no signing.
      - name: Check the Windows signing settings
        id: signpath
        if: runner.os == 'Windows'
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if [ -z "$SIGNPATH_API_TOKEN" ]; then
            echo "::warning title=Unsigned Windows build::No SIGNPATH_API_TOKEN secret, so the Windows app and installer are unsigned."
            exit 0
          fi
          missing=""
          for name in SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY_SLUG; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Windows signing isn't set up::There's a SIGNPATH_API_TOKEN secret, but these repository variables are missing:$missing. See Windows signing in docs/releasing.md."
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          {
            echo "sign=true"
            echo "version=$version"
            # electron-builder writes IncarnaMind.exe's product version as four numbers: 1.2.3.0.
            echo "windows-version=${version%%-*}.0"
          } >> "$GITHUB_OUTPUT"

      - name: Package and publish (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never

      # The app as the unsigned build ships it: electron-builder writes its update settings
      # (resources/app-update.yml) only when it builds the installer too, never with --dir.
      - name: Upload the Windows app for signing
        id: unsigned-app
        if: steps.signpath.outputs.sign == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-app-unsigned
          path: dist/win-unpacked/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          # A re-run of the job uploads it again.
          overwrite: true

      # Each signing request waits for an approver in SignPath, for up to two hours.
      - name: Sign the Windows app (SignPath)
        if: steps.signpath.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          parameters: |
            windowsVersion: ${{ toJSON(steps.signpath.outputs.windows-version) }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: ${{ runner.temp }}/signed-app

      - name: Package the Windows installer again, from the signed app
        if: steps.signpath.outputs.sign == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf dist/win-unpacked
          mv "$RUNNER_TEMP/signed-app" dist/win-unpacked
          if [ ! -f dist/win-unpacked/resources/app-update.yml ]; then
            echo "::error title=The signed app can't update itself::It has no resources/app-update.yml."
            exit 1
          fi
          npx electron-builder --win --x64 --prepackaged dist/win-unpacked --publish never

      - name: Upload the Windows installer for signing
        id: unsigned-installer
        if: steps.signpath.outputs.sign == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer-unsigned
          path: dist/IncarnaMind-${{ steps.signpath.outputs.version }}-win-x64.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Sign the Windows installer (SignPath)
        if: steps.signpath.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.signpath.outputs.version) }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: ${{ runner.temp }}/signed-installer

      - name: Use the signed Windows installer
        if: steps.signpath.outputs.sign == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.signpath.outputs.version }}
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/signedInstaller.ts \
            "$RUNNER_TEMP/signed-installer/IncarnaMind-$VERSION-win-x64.exe" dist

      # SignPath's test certificate is self-signed, so Windows doesn't trust its root: that one
      # error passes, with a warning, for a self-signed certificate only. The summary lists the
      # signer, which win.signtoolOptions.publisherName takes once the real certificate signs.
      - name: Check the Windows signatures
        if: steps.signpath.outputs.sign == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.signpath.outputs.version }}
        run: |
          # CERT_E_UNTRUSTEDROOT (0x800B0109), in the runner's language.
          $untrustedRoot = [System.ComponentModel.Win32Exception]::new(-2146762487).Message
          $failed = $false
          "| File | Signature | Signer |`n| --- | --- | --- |" >> $env:GITHUB_STEP_SUMMARY
          foreach ($file in "dist/win-unpacked/IncarnaMind.exe", "dist/IncarnaMind-$($env:VERSION)-win-x64.exe") {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            $signer = $signature.SignerCertificate
            $bad = $true
            if (-not $signer) {
              $result = "not signed"
            } elseif (-not $signature.TimeStamperCertificate) {
              $result = "signed without a timestamp"
            } elseif ($signature.Status -eq "Valid") {
              $result = "valid"
              $bad = $false
            } elseif ($signer.Subject -eq $signer.Issuer -and $signature.StatusMessage -eq $untrustedRoot) {
              $result = "signed with a self-signed certificate, which Windows doesn't trust"
              $bad = $false
              echo "::warning title=Test signature::$file is $result."
            } else {
              $result = "invalid: $($signature.StatusMessage)"
            }
            if ($bad) {
              echo "::error title=Windows signing failed::$file is $result."
              $failed = $true
            }
            "| $file | $result | $($signer.Subject) |" >> $env:GITHUB_STEP_SUMMARY
          }
          if ($failed) { exit 1 }

      - name: Package and publish (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --x64 --publish never

      # Fails the job when app.asar holds anything but out/, node_modules/ and package.json
      # (sources, tests, sample data), or when an app.asar or an installer is over its size
      # budget. The budgets are in scripts/check-package.mjs.
      - name: Check the package contents and sizes
        run: npm run check:package

      # The packaged app for this runner loads each engine module in the process that runs it and
      # starts Python, before anything is uploaded (#1239): a module can fail to load only in the
      # built app. The step fails naming the module. On macOS the check runs with the other packaged
      # specs in the step after this one.
      - if: runner.os != 'macOS'
        uses: ./.github/actions/packaged-engines

      # The packaged arm64 app loads every engine module, reads scans with real OCR (#1819) and
      # transcribes a meeting with its real speech engine and model (#1239).
      - if: runner.os == 'macOS'
        uses: ./.github/actions/packaged-transcription

      # What electron-builder would have published: the installers, their blockmaps and the
      # latest*.yml files auto-update reads (not builder-debug.yml), to the draft made above.
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.deb dist/*.blockmap dist/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Nothing to upload in dist/."
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
