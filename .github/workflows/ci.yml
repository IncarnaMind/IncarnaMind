name: CI

on:
  workflow_dispatch:

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  worker-probe:
    name: Windows migration-worker probe (#2104)
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Package the main process and renderer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          node node_modules/electron-vite/bin/electron-vite.js build --mode test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item e2e/lifecycleMain.cjs out/main/lifecycle.cjs
          $versions = Get-Content tests/fixtures/lifecycle-versions.json | ConvertFrom-Json
          npx electron-builder --win --x64 --dir --publish never "--config.directories.output=dist/lifecycle-old" "--config.extraMetadata.main=./out/main/lifecycle.cjs" "--config.extraMetadata.version=$($versions.old)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win --x64 --dir --publish never "--config.directories.output=dist/lifecycle-updated" "--config.extraMetadata.main=./out/main/lifecycle.cjs" "--config.extraMetadata.version=$($versions.updated)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The CI exercise, as the pull request job runs it
        continue-on-error: true
        run: |
          $env:INCARNAMIND_PACKAGED_APP = Join-Path $pwd "dist/lifecycle-old/win-unpacked/IncarnaMind.exe"
          $env:INCARNAMIND_PACKAGED_UPDATED_APP = Join-Path $pwd "dist/lifecycle-updated/win-unpacked/IncarnaMind.exe"
          node node_modules/@playwright/test/cli.js test singleInstance.spec.ts startupProgress.spec.ts Lifecycle.spec.ts --workers=1 --retries=0 --output=test-results/exercise
      - name: Fresh initial launches, ten each
        if: always()
        continue-on-error: true
        run: |
          $env:INCARNAMIND_PACKAGED_APP = Join-Path $pwd "dist/lifecycle-old/win-unpacked/IncarnaMind.exe"
          node node_modules/@playwright/test/cli.js test startupProgress.spec.ts --grep "a fresh initial launch reaches its native page" --repeat-each=10 --workers=1 --retries=0 --output=test-results/fresh
      - name: The startup spec, twice
        if: always()
        continue-on-error: true
        run: |
          $env:INCARNAMIND_PACKAGED_APP = Join-Path $pwd "dist/lifecycle-old/win-unpacked/IncarnaMind.exe"
          node node_modules/@playwright/test/cli.js test startupProgress.spec.ts --repeat-each=2 --workers=1 --retries=0 --output=test-results/startup-twice
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-probe
          path: test-results/
          retention-days: 7
