name: CI

# Every pull request: typecheck, lint, the unit tests, and the smoke specs it adds or changes.
# Nightly (nightly.yml) and a release (release.yml) run this file with every smoke spec.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # A change to ADRs or pictures only runs nothing. Every other document runs: unit tests read
    # the READMEs, CONTEXT.md and the guides in docs/ as text.
    paths:
      - "**"
      - "!docs/adr/**"
      - "!docs/images/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # onnxruntime-node's install script downloads its CUDA libraries on Linux x64. The app runs
  # the embedding model on the CPU, so skip them.
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck and lint
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint

  # Eight shards that run at once: as one job the unit tests take about an hour. A pull
  # request runs the tests its changes reach in Vitest's import graph; the nightly run and a
  # release run them all.
  unit:
    name: Meeting unit tests (${{ matrix.shard }}/4)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # The merge commit and its first parent, main, so the change is what this pull request adds.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # tests/main/sandbox.test.ts runs the OS sandbox, which needs bubblewrap, socat and ripgrep,
      # and unprivileged user namespaces, which Ubuntu 24.04 restricts through AppArmor.
      - uses: ./.github/actions/apt-install
        with:
          packages: bubblewrap socat ripgrep
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the meeting unit tests
        run: |
          mapfile -t files < <(rg --files tests/core tests/renderer tests/main tests/shared tests/eval | rg -i '(meeting|callhelp|earlierCall|otherCall|quickNote|capture|transcrip|audio|microphone|speaker|calendar|echo|soniox|liveRoute|recordCite|speech|askBar|roomVoice|roomDiar|roomReview|permissionGuide|voiceMemo|overlap|vad).*\.test\.tsx?$' | sort)
          test "${#files[@]}" -gt 100
          npx vitest run "${files[@]}" --shard "${{ matrix.shard }}/4" --reporter=default --reporter=json --outputFile=meeting-tests.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: meeting-units-${{ matrix.shard }}
          path: meeting-tests.json
          retention-days: 7
