name: Windows startup migration probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  startup-migration-probe:
    name: Instrumented packaged fresh startup (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Package the instrumented main once
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          node node_modules/electron-vite/bin/electron-vite.js build --mode test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item e2e/lifecycleMain.cjs out/main/lifecycle.cjs
          $versions = Get-Content tests/fixtures/lifecycle-versions.json | ConvertFrom-Json
          npx electron-builder --win --x64 --dir --publish never "--config.directories.output=dist/startup-migration-probe" "--config.extraMetadata.main=./out/main/lifecycle.cjs" "--config.extraMetadata.version=$($versions.old)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force probe-results | Out-Null
          node scripts/check-startup-migration-probe.mjs dist/startup-migration-probe/win-unpacked/resources/app.asar probe-results
          exit $LASTEXITCODE
      - name: Measure isolated fresh stores and exact-folder Defender control
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $report = Join-Path $pwd 'probe-results'
          $owned = Join-Path $env:RUNNER_TEMP "incarnamind-migration-$env:GITHUB_RUN_ID"
          $normal = Join-Path $owned 'normal'
          $excluded = Join-Path $owned 'excluded'
          New-Item -ItemType Directory -Force $normal, $excluded | Out-Null
          $env:INCARNAMIND_PACKAGED_APP = Join-Path $pwd 'dist/startup-migration-probe/win-unpacked/IncarnaMind.exe'
          $added = $false
          $available = $false
          $failures = 0
          $trials = @()
          $control = @{ requestedFolder = $excluded; added = $false; available = $false; status = 'not-attempted' }
          try {
            try {
              $status = Get-MpComputerStatus -ErrorAction Stop
              $control.antivirusEnabled = $status.AntivirusEnabled
              $control.realTimeProtectionEnabled = $status.RealTimeProtectionEnabled
            } catch {
              $control.statusQueryError = $_.Exception.Message
            }
            foreach ($arm in @('normal', 'excluded')) {
              if ($arm -eq 'excluded') {
                try {
                  $existing = @((Get-MpPreference -ErrorAction Stop).ExclusionPath)
                  if ($existing -contains $excluded) {
                    $control.status = 'exact-exclusion-already-present-no-change'
                  } else {
                    Add-MpPreference -ExclusionPath $excluded -ErrorAction Stop
                    $added = $true
                    $control.added = $true
                    $control.status = 'exact-owned-folder-added'
                  }
                  $available = @((Get-MpPreference -ErrorAction Stop).ExclusionPath) -contains $excluded
                  $control.available = $available
                } catch {
                  $control.status = 'unavailable'
                  $control.error = $_.Exception.Message
                }
                $control | ConvertTo-Json | Set-Content (Join-Path $report 'defender-control.json')
                if (-not $available) { continue }
              }
              $temp = if ($arm -eq 'normal') { $normal } else { $excluded }
              $env:TMPDIR = $temp
              $env:TEMP = $temp
              $env:TMP = $temp
              for ($trial = 1; $trial -le 5; $trial++) {
                $language = if (($trial % 2 -eq 1) -eq ($arm -eq 'normal')) { 'en' } else { 'zh-CN' }
                $output = "probe-results/$arm-$trial-$language"
                $log = Join-Path $report "$arm-$trial-$language.log"
                node node_modules/@playwright/test/cli.js test startupProgress.spec.ts --grep "a fresh initial launch reaches its native page \($language\)" --workers=1 --retries=0 --output=$output 2>&1 | Tee-Object $log
                $code = $LASTEXITCODE
                $trials += @{ arm = $arm; trial = $trial; language = $language; exitCode = $code; output = $output }
                $trials | ConvertTo-Json | Set-Content (Join-Path $report 'trials.json')
                if ($code -ne 0) { $failures++ }
              }
            }
          } finally {
            if ($added) {
              try {
                Remove-MpPreference -ExclusionPath $excluded -ErrorAction Stop
                $control.removed = -not (@((Get-MpPreference -ErrorAction Stop).ExclusionPath) -contains $excluded)
                if (-not $control.removed) { $failures++ }
              } catch {
                $control.cleanupError = $_.Exception.Message
                $failures++
              }
            }
            $control | ConvertTo-Json | Set-Content (Join-Path $report 'defender-control.json')
          }
          if ($trials.Count -lt 5) { throw 'The normal fresh-start arm did not complete.' }
          if ($failures -gt 0) { exit 1 }
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-migration-probe-windows
          path: probe-results/
          retention-days: 7
