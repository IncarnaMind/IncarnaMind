name: CI

# Probe for #3697, not for main: the Nightly's smoke shard 9 of 10, six times at once, each run as
# the Nightly runs it, with the press times of selectAcrossCitation.spec.ts in the log.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: ci-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  smoke-plan:
    name: Smoke specs to run
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.plan.outputs.specs }}
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: plan
        run: |
          node scripts/smoke-shard.mjs plan --all >> "$GITHUB_OUTPUT"
          grep '^count=' "$GITHUB_OUTPUT"

  smoke:
    name: Smoke tests (${{ matrix.shard }}/${{ needs.smoke-plan.outputs.count }}, Linux, attempt ${{ matrix.attempt }})
    needs: smoke-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [9]
        attempt: [1, 2, 3, 4, 5, 6]
    env:
      SMOKE_SPECS: ${{ needs.smoke-plan.outputs.specs }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Make sure Electron is installed
        run: |
          for attempt in 1 2 3; do
            node node_modules/electron/install.js && exit 0
            sleep 20
          done
          exit 1
      - name: Let Electron's sandbox start
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - uses: ./.github/actions/apt-install
        with:
          packages: fonts-noto-cjk
      - name: Run the specs
        run: |
          specs=$(node scripts/smoke-shard.mjs ${{ matrix.shard }} ${{ needs.smoke-plan.outputs.count }})
          test -n "$specs"
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          for number in 98 99; do
            Xvfb ":$number" -screen 0 1920x1080x24 -nolisten tcp >/dev/null 2>&1 &
            for _ in $(seq 100); do [ -S "/tmp/.X11-unix/X$number" ] && break; sleep 0.2; done
            test -S "/tmp/.X11-unix/X$number"
          done
          DISPLAY=:98 INCARNAMIND_DISPLAYS=:98,:99 npm run test:smoke -- --workers=2 --reporter=github,list,./scripts/probe-press-times.mjs $specs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results-${{ matrix.shard }}-attempt-${{ matrix.attempt }}
          path: |
            test-results/
            !test-results/feel/
          retention-days: 7
