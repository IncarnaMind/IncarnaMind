name: Run named specs

# The smoke specs a change touched, on a clean GitHub-hosted machine, so they need not run on your
# computer: Actions › Run named specs › Run workflow, or `node scripts/run-specs.mjs`
# (docs/agents/checks.md). By hand only and apart from ci.yml, so a run never blocks or replaces a
# required check.
on:
  workflow_dispatch:
    inputs:
      specs:
        description: 'Spec files, separated by spaces: each e2e/<name>.spec.ts or e2e/<name>.spec.ts:<line>'
        required: true
        type: string
      os:
        description: Machine to run on
        type: choice
        options: [linux, macos, windows]
        default: linux
      repeat:
        description: Times to run each test, 1 to 10
        type: number
        default: 1
      grep:
        description: Only the tests whose title matches this regular expression (optional)
        required: false
        type: string

permissions:
  contents: read

env:
  # onnxruntime-node's install script downloads its CUDA libraries on Linux x64. The app runs
  # the embedding model on the CPU, so skip them.
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  # One run per branch and machine: a new dispatch replaces the one still going. macOS runners
  # are few, and the Nightly shares them.
  group: specs-${{ github.ref }}-${{ inputs.os }}
  cancel-in-progress: true

jobs:
  paired:
    name: alpha.7 and candidate 4 on one Mac
    runs-on: macos-latest
    timeout-minutes: 125
    env:
      INCARNAMIND_KEEP_ARTIFACTS: "1"
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1826d663251c5f4c05003a33ed36d93f4535b838
          path: alpha7
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 635792fd90bd18f9cea06bded1fb72b03a586c44
          path: candidate4
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: alpha7/.nvmrc
          cache: npm
          cache-dependency-path: |
            alpha7/package-lock.json
            candidate4/package-lock.json
      - name: Verify both checked-out versions
        shell: bash
        run: |
          mkdir compact measurements
          test "$(git -C alpha7 rev-parse HEAD)" = 1826d663251c5f4c05003a33ed36d93f4535b838
          test "$(git -C candidate4 rev-parse HEAD)" = 635792fd90bd18f9cea06bded1fb72b03a586c44
          for file in .nvmrc playwright.config.ts e2e/feel.ts e2e/feelLibrary.spec.ts; do
            cmp "alpha7/$file" "candidate4/$file"
          done
          { git -C alpha7 rev-parse HEAD; git -C candidate4 rev-parse HEAD; sw_vers; uname -m; node --version; } > compact/machine.txt
      - run: npm ci
        working-directory: alpha7
      # Downloads from GitHub's releases fail now and then (a 500), so a failed download is tried
      # again here rather than failing every spec.
      - name: Make sure Electron is installed
        working-directory: alpha7
        shell: bash
        run: |
          for attempt in 1 2 3; do
            node node_modules/electron/install.js && exit 0
            sleep 20
          done
          exit 1
      # Playwright records the app's video with its own ffmpeg, which the Electron install doesn't
      # bring: without it the app's first window never opens.
      - name: Install the recorder's ffmpeg
        working-directory: alpha7
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx playwright install ffmpeg && exit 0
            sleep 20
          done
          exit 1
      - run: npm ci
        working-directory: candidate4
      # Downloads from GitHub's releases fail now and then (a 500), so a failed download is tried
      # again here rather than failing every spec.
      - name: Make sure Electron is installed
        working-directory: candidate4
        shell: bash
        run: |
          for attempt in 1 2 3; do
            node node_modules/electron/install.js && exit 0
            sleep 20
          done
          exit 1
      # Playwright records the app's video with its own ffmpeg, which the Electron install doesn't
      # bring: without it the app's first window never opens.
      - name: Install the recorder's ffmpeg
        working-directory: candidate4
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx playwright install ffmpeg && exit 0
            sleep 20
          done
          exit 1
      - name: Run eight counterbalanced pairs without a test retry
        shell: bash
        run: |
          set -eu
          for pair in {1..8}; do
            if (( pair % 2 == 1 )); then arms=(alpha7 candidate4); else arms=(candidate4 alpha7); fi
            for arm in "${arms[@]}"; do
              sample="$pair-$arm"
              out="$GITHUB_WORKSPACE/measurements/$sample"
              small="$GITHUB_WORKSPACE/compact/$sample"
              mkdir "$out" "$small"
              echo "$sample" | tee -a compact/order.txt
              status=0
              (cd "$arm" && npm run test:smoke -- e2e/feelLibrary.spec.ts:33 '--grep=scrolling the Library with 2,000 Documents' --repeat-each 1 --retries=0 --add-reporter json) > "$out/runner.log" 2>&1 || status=$?
              echo "$status" > "$small/exit-code"
              if [[ -d "$arm/test-results" ]]; then
                mv "$arm/test-results" "$out/results"
                for apptrace in "$out"/results/*/trace-incarnamind-smoke-*.zip; do
                  if [[ -f "$apptrace" ]]; then
                    unzip -p "$apptrace" trace.trace | gzip -c > "$small/app-trace.jsonl.gz"
                  fi
                done
                for file in report.json feel/library-2000.json; do
                  if [[ -f "$out/results/$file" ]]; then cp "$out/results/$file" "$small/"; fi
                done
              fi
              echo "$sample exit=$status"
            done
          done
      - name: Upload per-launch measurements and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-measurements
          path: compact
          retention-days: 14
      - name: Upload original traces and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-traces
          path: measurements
          retention-days: 14
      - name: Preserve original test verdicts
        shell: bash
        run: |
          set -eu
          for pair in {1..8}; do
            for arm in alpha7 candidate4; do
              dir="compact/$pair-$arm"
              test -s "$dir/report.json" && test -s "$dir/library-2000.json" && test "$(cat "$dir/exit-code")" = 0 || exit 1
            done
          done
