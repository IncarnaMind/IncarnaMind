name: Probe 3643 (throwaway)

# Removed before the pull request: what an AI app's config would be given as IncarnaMind's
# launcher from the published AppImage and .deb, and whether the program inside an AppImage's
# mount starts the agent shim in Node mode.
on:
  push:
    branches: [fix/3643-appimage-launcher]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download 0.1.0-alpha.7 for Linux
        run: |
          gh release download v0.1.0-alpha.7 --repo "$GITHUB_REPOSITORY" -p '*.AppImage' -p '*.deb'
          ls -la
          head -3 /etc/os-release
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
      - name: FUSE for the AppImage
        run: sudo apt-get update -q && sudo apt-get install -y -q libfuse2t64
      - name: The AppImage's own program in Node mode, as the launcher runs it today
        run: |
          chmod +x ./*.AppImage
          IMG="$PWD/$(ls *.AppImage)"
          cat > probe.js <<'EOF'
          const { join, dirname } = require("node:path");
          const { existsSync } = require("node:fs");
          const shim = join(dirname(process.execPath), "resources", "app.asar", "out", "main", "agentShim.js");
          console.log(JSON.stringify({ execPath: process.execPath, argv: process.argv, shim, shimThere: existsSync(shim) }));
          EOF
          for run in 1 2; do
            "$IMG" --appimage-mount > mount.txt &
            MOUNTER=$!
            for i in $(seq 1 50); do [ -s mount.txt ] && break; sleep 0.2; done
            MNT=$(head -1 mount.txt)
            echo "run $run mount: $MNT"
            ELECTRON_RUN_AS_NODE=1 "$MNT/incarnamind" "$PWD/probe.js" | tee "run$run.json"
            echo "--- the shim from that mount, stdin closed, no app running:"
            ELECTRON_RUN_AS_NODE=1 timeout 15 "$MNT/incarnamind" "$MNT/resources/app.asar/out/main/agentShim.js" < /dev/null; echo "shim exit $?"
            kill "$MOUNTER"; wait "$MOUNTER" 2>/dev/null || true
            sleep 1
            if [ -e "$MNT/incarnamind" ]; then echo "run $run: program still there after the AppImage ended"; else echo "run $run: program gone after the AppImage ended"; fi
          done
          node -e 'const f=require("node:fs");const [a,b]=["run1.json","run2.json"].map(x=>JSON.parse(f.readFileSync(x,"utf8").trim().split("\n").pop()));console.log("same program path both runs:",a.execPath===b.execPath)'
      - name: The .deb's program in Node mode
        run: |
          sudo apt-get install -y -q ./*.deb >/dev/null
          ls -la /usr/bin/incarnamind || true
          BIN=$(readlink -f /usr/bin/incarnamind || echo /opt/IncarnaMind/incarnamind)
          echo "deb program: $BIN"
          ELECTRON_RUN_AS_NODE=1 "$BIN" "$PWD/probe.js"
