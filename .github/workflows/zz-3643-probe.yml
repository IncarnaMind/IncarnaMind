name: Probe 3643 (throwaway)

# Removed before the pull request: this branch's AppImage, built and started twice, keeps the agent
# connection's command working from one start to the next.
on:
  push:
    branches: [fix/3643-appimage-launcher]

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build this branch's AppImage
        run: |
          npm run build
          npx electron-builder --linux AppImage --x64 --publish never
          ls -la dist/*.AppImage
      - name: FUSE and a display
        run: sudo apt-get update -q && sudo apt-get install -y -q libfuse2t64 xvfb
      - name: Start it twice; the connection's command works each time
        run: |
          IMG="$(ls "$PWD"/dist/*.AppImage)"
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          SCRIPT="$HOME/.config/IncarnaMind/agent-connection"
          for start in 1 2; do
            setsid xvfb-run -a "$IMG" > "app$start.log" 2>&1 &
            APP=$!
            for i in $(seq 1 90); do [ -f "$SCRIPT" ] && grep -q "mount_" "$SCRIPT" && break; sleep 1; done
            sleep 5
            echo "=== start $start: the script"
            ls -la "$SCRIPT"
            cat "$SCRIPT"
            PROGRAM=$(sed -n "s/^program='\(.*\)'$/\1/p" "$SCRIPT")
            echo "program there while it runs: $([ -x "$PROGRAM" ] && echo yes || echo no)"
            echo "--- the script started as an AI app starts it, with no request:"
            timeout 15 "$SCRIPT" < /dev/null; echo "script exit $?"
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"probe","version":"0"}}}' | timeout 15 "$SCRIPT" | head -c 600; echo
            echo "script exit ${PIPESTATUS[1]}"
            kill -- "-$APP" || true
            wait "$APP" 2>/dev/null || true
            sleep 5
            echo "program there after it quit: $([ -e "$PROGRAM" ] && echo yes || echo no)"
            echo "--- the script with IncarnaMind closed:"
            timeout 15 "$SCRIPT" < /dev/null; echo "script exit $?"
            echo "$PROGRAM" > "program$start.txt"
          done
          echo "same program both starts: $([ "$(cat program1.txt)" = "$(cat program2.txt)" ] && echo yes || echo no)"
          tail -20 app1.log app2.log
